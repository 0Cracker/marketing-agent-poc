name: Quick Tunnel QA

on:
  push:
    branches:
      - 'qa/**'
    paths:
      - 'api/qa/quick-tunnel.mjs'
      - 'scripts/qa/quick-tunnel-smoke-server.mjs'
      - 'tests/qa/quick-tunnel-smoke.test.mjs'
      - '.github/workflows/quick-tunnel-qa.yml'
  pull_request:
    paths:
      - 'api/qa/quick-tunnel.mjs'
      - 'scripts/qa/quick-tunnel-smoke-server.mjs'
      - 'tests/qa/quick-tunnel-smoke.test.mjs'
      - '.github/workflows/quick-tunnel-qa.yml'

jobs:
  quick-tunnel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --include=dev --include=optional
      - run: node --test tests/qa/quick-tunnel-smoke.test.mjs
      - run: npm run lint
      - run: npm run build
