const prod=Object.fromEntries(D.products.map(p=>[p.product_id,p]));

const pct=(n,d=1)=>n==null?'—':fmt(n,d)+'%';

const money=(n,c,compact=false)=>{if(n==null)return '—';const u=currencies[c];return compact?new Intl.NumberFormat('ko-KR',{notation:'compact',maximumFractionDigits:1}).format(n)+' '+u:fmt(n,u==='USD'?2:0)+' '+u};
const metric=(name,value,note)=>`<section class="md-metric"><span>${name}</span><strong>${value}</strong><small>${note}</small></section>`;
const panel=(title,sub,body)=>`<section class="md-panel"><div class="md-panel-head"><div><h2>${title}</h2><small>${sub}</small></div></div>${body}</section>`;
const table=(headers,rows)=>`<div class="md-table-wrap"><table class="md-table"><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const bars=(rows,unit='%')=>rows.map(([name,v,color])=>`<div class="md-rowbar"><span>${name}</span><div class="md-track"><i style="width:${Math.min(100,v)}%;${color?'background:var(--md-green)':''}"></i></div><strong>${fmt(v,1)}${unit}</strong></div>`).join('');
function chart(series,dates,unit){
 const values=series.flatMap(s=>s.values.filter(v=>v!==null));
 if(!values.length)return '<div class="md-empty"><p>선택한 범위에 표시할 관측값이 없습니다.</p></div>';
 const max=Math.max(...values)*1.16||1;
 const lines=series.map((s,si)=>{const pts=s.values.map((v,i)=>v===null?null:[i,v]);let path='';pts.forEach((p,i)=>{if(p)path+=(i===0||pts[i-1]===null?'M':'L')+` ${48+p[0]*292/Math.max(1,dates.length-1)} ${164-p[1]/max*135} `});return `<path d="${path}" fill="none" stroke="var(--md-${si?'green':'blue'})" stroke-width="2.4" ${si?'stroke-dasharray="5 4"':''}/>${pts.filter(Boolean).map(p=>`<circle cx="${48+p[0]*292/Math.max(1,dates.length-1)}" cy="${164-p[1]/max*135}" r="2.3" fill="var(--md-${si?'green':'blue'})"><title>${s.name} ${dates[p[0]]}: ${fmt(p[1],2)} ${unit}</title></circle>`).join('')}`}).join('');
 const ticks=[0,max/2,max];
 const idx=[...new Set([0,Math.floor((dates.length-1)/2),dates.length-1])];
 return `<svg class="md-chart" viewBox="0 0 360 205" preserveAspectRatio="none" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} 추이. 단위 ${unit}"><text x="4" y="13">${unit}</text>${ticks.map(v=>`<line x1="48" y1="${164-v/max*135}" x2="340" y2="${164-v/max*135}" stroke="var(--md-grid)"/><text x="40" y="${168-v/max*135}" text-anchor="end">${new Intl.NumberFormat('ko-KR',{notation:'compact',maximumFractionDigits:1}).format(v)}</text>`).join('')}${lines}${idx.map(i=>`<text x="${48+i*292/Math.max(1,dates.length-1)}" y="190" text-anchor="${i===0?'start':i===dates.length-1?'end':'middle'}">${dates[i]}</text>`).join('')}</svg><div class="md-legend">${series.map((s,i)=>`<span><i class="md-key ${i?'secondary':''}"></i>${s.name}${i?' (점선)':''}</span>`).join('')}</div>`;
}
function page(state){
 const c=state.country,month=state.month,cur=currencies[c];
 const market=D.market.filter(r=>r[1]===c&&r[2]===month+'-01');
 const own=market.filter(r=>prod[r[3]].brand_role==='own');
 const monthly=D.ads.filter(r=>r[1]===c&&r[4]==='month'&&r[2]===month+'-01');
 const reviews=D.reviews.filter(r=>r.country_code===c&&r.written_at.startsWith(month));
 let stats='',left='',right='',records='',note='';
 if(state.tab==='market'){
  const total=market[0][6],self=sum(own,5),share=ratio(self,total,100);
  const prior=D.market.filter(r=>r[1]===c&&r[2]===`${Number(month.slice(0,4))-1}${month.slice(4)}-01`&&prod[r[3]].brand_role==='own');
  const prevShare=ratio(sum(prior,5),prior[0]?.[6],100);
  const sales=D.sales.filter(r=>r[1]===c&&r[2]===month+'-01');
  stats=metric('모의 시장 판매액',money(total,c,true),'선정 6제품 + 기타 제품')+metric('자사 판매액 비중',pct(share),`${fmt(share-prevShare,2)}%p · 전년 동월 대비`)+metric('자사 판매량',fmt(sum(own,4))+'개','자사 제품 A·B 합계')+metric('자사 순매출',money(sum(sales,6),c,true),'별도 자사 판매 원천');
  const hist=D.market.filter(r=>r[1]===c&&r[2]>=`${Number(month.slice(0,4))-1}${month.slice(4)}-01`&&r[2]<=month+'-01');
  const dates=[...new Set(hist.map(r=>r[2]))];
  left=panel('자사 판매액 비중 추이','시장 전체 금액을 분모로 계산',chart([{name:'자사 브랜드',values:dates.map(d=>{const rr=hist.filter(r=>r[2]===d);return ratio(sum(rr.filter(r=>prod[r[3]].brand_role==='own'),5),rr[0][6],100)})}],dates.map(d=>d.slice(2,7)), '%'));
  const br=['B1','B2','B3'].map((b,i)=>[i?'경쟁'+i:'자사',ratio(sum(market.filter(r=>prod[r[3]].brand_id===b),5),total,100),i>0]);
  br.push(['기타',ratio(total-sum(market,5),total,100),true]);
  right=panel('브랜드별 판매액 비중','동일 국가 · 동일 모의 유통 범위',bars(br));
  records=panel('제품별 시장 성과','샴푸 · 300ml · A/B 비교군 구분',table(['제품','비교군','판매량','판매액','시장 내 비중'],market.map(r=>[`${shortName(r[3])}<small>${r[3]}</small>`,prod[r[3]].comparison_group,fmt(r[4]),money(r[5],c),pct(r[5]/total*100)])));
  note=`${names[c]} 자사 판매액 비중은 ${pct(share)}입니다. 전년 동월 대비 ${fmt(share-prevShare,2)}%p 변했습니다. 경쟁사 가격·재고·리뷰를 함께 확인할 수 있습니다.`;
 }else if(state.tab==='consumer'){
  const ownReviews=reviews.filter(r=>prod[r.product_id].brand_role==='own');

  note='현재 지출과 효율을 비교하는 화면입니다. 예측 모델 없이 기존 ROAS에 예산을 곱해 예상 성과를 만들지 않습니다.';
 }else{
  const quality=D.quality.filter(r=>r.country_code===c);

 return {stats,left,right,records,note};
}
const settings=[{id:'monitor-draft',tab:'market',name:'통합 모니터형'},{id:'workbench-draft',tab:'ads',name:'분석 워크벤치형'},{id:'brief-draft',tab:'consumer',name:'브리핑·탐색형'}];
function fitCharts(){
 for(const svg of root.querySelectorAll('.md-chart')){
  const w=svg.getBoundingClientRect().width;if(w<100)continue;
  svg.setAttribute('viewBox',`0 0 ${w} 205`);
  const scale=(w-68)/292,map=x=>x<=48?x:48+(x-48)*scale;
  for(const el of svg.querySelectorAll('text,line,circle'))for(const attr of ['x','x1','x2','cx'])if(el.hasAttribute(attr)){
   const key='data-original-'+attr;if(!el.hasAttribute(key))el.setAttribute(key,el.getAttribute(attr));
   el.setAttribute(attr,map(Number(el.getAttribute(key))));
  }
  for(const path of svg.querySelectorAll('path'))path.setAttribute('transform',`translate(48 0) scale(${scale} 1) translate(-48 0)`);
 }
}
for(const setting of settings){
 const app=root.querySelector('#'+setting.id),state={...setting,country:'JP',month:'2026-08'};
 function render(){
  const p=page(state),uid=setting.id;

  const content=`<main class="md-main"><div class="md-head"><div><h1>${labels[state.tab]}</h1><p class="md-sub">${names[state.country]} · 샴푸 · 300ml · ${state.month.replace('-','년 ')}월</p></div>${filter}</div><div class="md-sourcebar"><span class="md-dot"></span><span>${sources[state.tab]}</span><span>원천 상세 보기에서 기준 확인</span></div><div id="${uid}-content" role="tabpanel" aria-labelledby="${uid}-${state.tab}" class="md-content" aria-live="polite"><div class="md-metrics">${p.stats}</div><div class="md-charts">${p.left}${p.right}</div>${setting.id==='brief-draft'?`<div class="md-note">${p.note}</div>`:''}${p.records}</div>${setting.id!=='brief-draft'?`<div class="md-note">${p.note}</div>`:''}<details><summary>원천·집계 기준</summary><p class="md-quiet">D003B 원본 11종 1,652건. 월간 2024/10–2026/09, 상세 2026/08/03–08/30. 통화 간 합산 없음. 월간·일별 중복 합산 없음. 모의 시장 전체를 분모로 사용. 미확보·결측은 그대로 표시.</p></details></main>`;
  app.innerHTML=`<header class="md-topbar"><div class="md-mark"><span class="md-logo">M</span>마케팅 인사이트</div><small>가상 자사 브랜드</small><span class="md-pill">가상 데이터</span></header>${setting.id==='workbench-draft'?`<div class="md-layout">${nav}${content}</div>`:nav+content}<footer class="md-footer"><span>D003B · 한국 / 일본 / 미국 · 화면 구성 초안</span><span>원천 값 유지 · 실제 집행 없음</span></footer>`;
  requestAnimationFrame(fitCharts);
 }
 app.addEventListener('click',e=>{const t=e.target.closest('[data-domain]');if(t){state.tab=t.dataset.domain;render();}});
 app.addEventListener('change',e=>{if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;render();}});
 render();
 new ResizeObserver(fitCharts).observe(app);
 if(globalThis.Tweak){const style={compact:false};const tweak=new Tweak({container:app,onChange:()=>app.style.setProperty('font-size',style.compact?'12px':'13px')});tweak.addToggle(style,'compact',{label:'본문 밀도 높이기'});}

<script>const variants=[...document.querySelectorAll('[data-variant]')];const picker=document.getElementById('draft-picker');function showVariant(i){variants.forEach((v,j)=>{v.hidden=i!==j;picker.children[j].setAttribute('aria-pressed',String(i===j))})}variants.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.dataset.variant;b.type='button';b.onclick=()=>showVariant(i);picker.append(b)});showVariant(0);</script></body></html>
