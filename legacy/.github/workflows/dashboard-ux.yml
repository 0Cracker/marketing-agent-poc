name: Dashboard UX checks
on:
  pull_request:
    paths:
      - 'frontend/workbench/**'
      - 'tests/roas-format-ux.test.mjs'
      - 'tests/review-analysis.test.mjs'
      - 'tests/review-projection.test.mjs'
      - 'tests/review-ui-exhaustive.test.mjs'
      - 'scripts/review-data.mjs'
      - 'data/roas-*.json'
      - 'shared/**'
      - 'package*.json'
      - '.github/workflows/dashboard-ux.yml'
  push:
    branches: [dev]
    paths:
      - 'frontend/workbench/**'
      - 'tests/roas-format-ux.test.mjs'
      - 'tests/review-analysis.test.mjs'
      - 'tests/review-projection.test.mjs'
      - 'tests/review-ui-exhaustive.test.mjs'
      - 'scripts/review-data.mjs'
      - 'data/roas-*.json'
      - 'shared/**'
      - 'package*.json'
      - '.github/workflows/dashboard-ux.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --pretty false
      - run: npx eslint frontend/workbench/training-analysis-panel.tsx frontend/workbench/training-analysis.ts frontend/workbench/training-dashboard.tsx frontend/workbench/training-presentation.ts frontend/workbench/training-format.ts frontend/workbench/review-analysis.ts frontend/workbench/review-projection.ts frontend/workbench/review-analysis-section.tsx tests/roas-format-ux.test.mjs tests/review-analysis.test.mjs tests/review-projection.test.mjs tests/review-ui-exhaustive.test.mjs
      - run: node --experimental-strip-types --test tests/roas-format-ux.test.mjs tests/review-analysis.test.mjs tests/review-projection.test.mjs tests/review-ui-exhaustive.test.mjs
      - run: npm run build